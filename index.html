<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riff</title>
<!-- ルート URL を開いたときにサポートページへ送る。
     GitHub Pages は index.html が無いとルートが 404 になるので、その受け皿。
     ⚠️ JS ではなく meta refresh なのは、JS を切っていても必ず飛ぶようにするため。
        下のリンクは refresh が効かない環境（一部のクローラ・古い環境）向けの保険。 -->
<meta http-equiv="refresh" content="0; url=support.html">
<link rel="canonical" href="support.html">
<style>
  :root { --bg: #F2F2F0; --ink: #2D2C2A; --accent: #30A46C; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111110; --ink: #f4f4f2; --accent: #3CB87C; }
  }
  body {
    margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: var(--bg); color: var(--ink);
    font: 16px/1.75 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Apple SD Gothic Neo", "Helvetica Neue", Arial, sans-serif;
  }
  h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
  <h1>Riff</h1>
  <p><a href="support.html">Support</a> · <a href="privacy.html">Privacy Policy</a></p>
</body>
</html>
